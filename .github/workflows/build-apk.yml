name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x frontend/android/gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore frontend/android/app/release.keystore -alias simbim -keyalg RSA -keysize 2048 -validity 10000 -storepass simbim123 -keypass simbim123 -dname "CN=SIM-BIM, OU=IT, O=SDI Bina Insan Mandiri, L=Purwokerto, ST=Jawa Tengah, C=ID"

      - name: Build Release APK with Gradle
        run: |
          cd frontend/android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK (Recommended)
        uses: actions/upload-artifact@v4
        with:
          name: SIM-BIM-Purwokerto-Release
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

